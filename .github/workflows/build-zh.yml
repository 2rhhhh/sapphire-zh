name: build-zh
on:
  push:
    paths-ignore:
      - "build-log-*.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version | tee -a "$GITHUB_WORKSPACE/build.log"
          ls -d /Applications/Xcode*.app | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Build (Release, unsigned)
        id: build
        run: |
          set -o pipefail
          xcodebuild \
            -project Sapphire.xcodeproj \
            -scheme Sapphire \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Locate products
        if: always()
        run: |
          {
            echo "=== exit code: ${{ steps.build.outcome }}"
            echo "=== products:"
            find build -maxdepth 6 -name "*.app" -print 2>/dev/null || true
            echo "=== tail of log:"
            tail -n 80 "$GITHUB_WORKSPACE/build.log" || true
          } | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Package
        if: success()
        run: |
          set -e
          APP="$(find build -maxdepth 6 -name 'Sapphire.app' -print -quit)"
          test -n "$APP" || { echo "no Sapphire.app found" | tee -a build.log; exit 1; }
          ditto -c -k --keepParent "$APP" Sapphire-zh.app.zip
          ls -lh Sapphire-zh.app.zip | tee -a build.log

      - name: Upload log to repo
        if: always()
        run: |
          cp build.log "build-log-${{ github.run_number }}.txt"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "build-log-${{ github.run_number }}.txt"
          git commit -m "build log #${{ github.run_number }}" || true
          git push || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Sapphire-zh
          path: Sapphire-zh.app.zip
          if-no-files-found: error

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zh-build-${{ github.run_number }}
          name: Sapphire 中文版 build ${{ github.run_number }}
          files: Sapphire-zh.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
